; このファイルを config.ini にコピーして、パスを自分のMacに合わせて書き換えてください
; config.ini は Git に登録されません（PCごとに設定が違うため）

[paths]
; 特別価格回答Excelを置いている共有フォルダ（サブフォルダも含めて読み込みます）
; OneDrive の例: ~/Library/CloudStorage/OneDrive-会社名/特別価格回答
; Google Drive の例: ~/Library/CloudStorage/GoogleDrive-メールアドレス/マイドライブ/特別価格回答
input_dir = ~/Library/CloudStorage/OneDrive-会社名/特別価格回答

; 集約結果の出力先（省略すると price-db/output/価格マスタ.xlsx）
; 共有フォルダ内に置くとチームで見られます（集約時に自身は読み込み対象から除外されます）
output_file =
